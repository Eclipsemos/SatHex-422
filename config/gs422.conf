# Paths and divisors must match this board. No credentials in this file.
port=/dev/ttyS6
ethernet1=auto
ethernet2=auto
wifi=auto
smi=/usr/local/houmo-sdk/tools/hm_smi/hm_smi
card=0
soc_temp_path=
soc_divisor=10
current_path=/sys/class/hwmon/hwmon8/curr1_input
current_divisor=1000
wifi_timeout=45
cache_ttl_ms=5000
sample_interval_ms=1000
sensor_timeout_ms=2000
# Queries can inspect all containers. Controls require exact names or full IDs.
docker_socket=/var/run/docker.sock
# Semicolon-separated allowlist; empty means no container controls enabled.
docker_allow=
